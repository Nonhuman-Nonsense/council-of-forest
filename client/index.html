<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/icons/favicon-32.webp" type="image/webp" sizes="32x32" />
  <link rel="icon" href="/icons/favicon-48.webp" type="image/webp" sizes="48x48" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="author" content="Nonhuman Nonsense">
  <meta name="description"
    content="What if the forest were someone rather than something? Join a council where the river, the reindeer, the lichen and other beings of the Vindelälven biosphere area speak through AI." />
  <meta property="og:image" content="/council-of-forest-preview.webp" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="/manifest.json" />
  <title>Council of Forest</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!--
    Browsers too old to run the bundle at all (no module scripts, or without the newest APIs it
    leans on) would otherwise show a blank page. Plain ES5 on purpose. Everything newer is
    checked in React (src/browserSupport.ts), which shows the same advice in its own overlay.
  -->
  <script>
    (function () {
      var ok = "noModule" in document.createElement("script") &&
        typeof window.structuredClone === "function" &&
        typeof Array.prototype.at === "function" &&
        !!window.AbortSignal && typeof window.AbortSignal.timeout === "function";
      if (ok) return;
      var sv = /^\/sv(\/|$)/.test(window.location.pathname);
      document.documentElement.setAttribute("data-unsupported", "");
      document.getElementById("root").innerHTML =
        '<div style="font-family: sans-serif; color: #fff; background: #000; min-height: 100vh; ' +
        'display: flex; flex-direction: column; justify-content: center; align-items: center; ' +
        'text-align: center; padding: 24px; box-sizing: border-box;">' +
        (sv
          ? "<h2>Rådet kan inte köras i den här webbläsaren</h2>" +
            "<p>Uppdatera den, eller öppna sidan i en aktuell version av Chrome, Firefox eller Safari.</p>"
          : "<h2>This browser can't run the council</h2>" +
            "<p>Please update it, or open this page in an up-to-date Chrome, Firefox or Safari.</p>") +
        "</div>";
    })();
  </script>

  <!-- Main Vite React entry -->
  <script type="module" src="/src/index.jsx"></script>

  <script>
    // Listen for the wheel event
    window.addEventListener(
      "wheel",
      function (event) {
        // Check if the Ctrl key is pressed
        if (event.ctrlKey) {
          // Prevent the default behavior (zooming)
          event.preventDefault();
        }
      },
      { passive: false }
    ); // Add { passive: false } option
  </script>
</body>

</html>
